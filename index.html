<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elsa — AI-native product studio</title>
    <meta name="description" content="Elsa is an independent studio shipping mobile games and apps end to end: Şoreş Toy Workshop, Sand Canvas, Colour Alchemist, Sincere Salah, BazaltGo, Deprem Mesh." />
    <meta property="og:title" content="Elsa Studio" />
    <meta property="og:description" content="Games and apps, built AI-native." />
    <meta property="og:image" content="media/sc-pour.webp" />
    <meta name="theme-color" content="#05060c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2305060c'/%3E%3Cpath d='M20 16h24v6H27v7h15v6H27v7h17v6H20z' fill='%23e8e4ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <header id="top">
      <a href="#/" class="logo" aria-label="Elsa Studio">
        <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d2ff"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><path d="M8 4h24v6H15v7h15v6H15v7h17v6H8z" fill="url(#lg)"/></svg>
        <span>ELSA</span>
      </a>
      <nav id="nav-list"></nav>
      <div class="hdr-r">
        <button id="sound" type="button" aria-label="Sound">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="snd-on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/><path class="snd-off" d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
        <button id="lang" type="button" aria-label="Language">TR</button>
        <button id="menu" type="button" aria-label="Menu"><i></i><i></i></button>
      </div>
    </header>
    <main id="page"></main>
    <div id="hud" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true"></div>
    <div id="curtain" class="on">
      <div class="loader">
        <div class="ld-word"><span>E</span><span>L</span><span>S</span><span>A</span></div>
        <div class="ld-row"><span>AI-NATIVE PRODUCT STUDIO</span><span id="load-num">000</span></div>
        <div class="ld-line"><i id="load-bar"></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
